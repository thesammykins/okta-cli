name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  bump-version:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bump2version
    
    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    
    - name: Get current version
      id: current_version
      run: |
        CURRENT_VERSION=$(grep -E "^version = " pyproject.toml | cut -d'"' -f2)
        echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_OUTPUT
    
    - name: Bump version
      id: bump_version
      run: |
        bump2version ${{ github.event.inputs.version_type }} --verbose
        NEW_VERSION=$(grep -E "^version = " pyproject.toml | cut -d'"' -f2)
        echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
    
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "Bump version from ${{ steps.current_version.outputs.CURRENT_VERSION }} to ${{ steps.bump_version.outputs.NEW_VERSION }}"
        title: "Version bump: ${{ steps.current_version.outputs.CURRENT_VERSION }} → ${{ steps.bump_version.outputs.NEW_VERSION }}"
        body: |
          ## Version Bump
          
          This PR bumps the version from `${{ steps.current_version.outputs.CURRENT_VERSION }}` to `${{ steps.bump_version.outputs.NEW_VERSION }}`.
          
          ### Changes
          - Updated version in `pyproject.toml`
          - Updated version in `__init__.py` (if present)
          
          ### Type
          - **${{ github.event.inputs.version_type }}** version bump
          
          ### Next Steps
          After merging this PR:
          1. Create a new release with tag `v${{ steps.bump_version.outputs.NEW_VERSION }}`
          2. The release workflow will automatically build and publish the package
          
          ---
          
          🤖 Generated by GitHub Actions
        branch: version-bump-${{ steps.bump_version.outputs.NEW_VERSION }}
        delete-branch: true