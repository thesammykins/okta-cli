name: Static Analysis & Security Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff mypy bandit
        pip install types-requests types-PyYAML types-tabulate
        
    - name: Run Ruff linting
      run: |
        ruff check --select F,E,W,I okta_cli
        
    - name: Run MyPy type checking
      run: |
        mypy okta_cli
        
    - name: Run Bandit security analysis
      run: |
        bandit -r okta_cli
        
    - name: Check for legacy config.get_config patterns
      run: |
        PATTERN_COUNT=$(grep -r "config\.get_config(" okta_cli --exclude-dir="__pycache__" | grep -v "Replace config.get_config()" | wc -l || echo 0)
        if [ "$PATTERN_COUNT" -ne 0 ]; then
          echo "❌ Found $PATTERN_COUNT instances of legacy config.get_config pattern"
          grep -r "config\.get_config(" okta_cli --exclude-dir="__pycache__" | grep -v "Replace config.get_config()" || true
          exit 1
        else
          echo "✅ No legacy config.get_config patterns found"
        fi
        
    - name: Run comprehensive CI checks
      run: |
        ./ci_checks.sh
