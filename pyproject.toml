[project]
name = "okta-cli"
version = "1.0.0"
description = "A comprehensive command-line interface for managing Okta identity and access management operations."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Samantha Myers", email = "thesammykins@gmail.com"},
]
license = {text = "MIT"}
keywords = ["okta", "cli", "identity", "access", "management", "iam"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0.0",
    "requests>=2.25.0",
    "cryptography>=3.4.0",
    "tabulate>=0.9.0",
    "PyYAML>=6.0",
]

[project.urls]
"Homepage" = "https://github.com/thesammykins/okta-cli"
"Bug Tracker" = "https://github.com/thesammykins/okta-cli/issues"
"Documentation" = "https://github.com/thesammykins/okta-cli/blob/main/docs/"
"Source Code" = "https://github.com/thesammykins/okta-cli"
"Releases" = "https://github.com/thesammykins/okta-cli/releases"

[project.scripts]
okta-cli = "okta_cli.main:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["okta_cli*"]
